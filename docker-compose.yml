version: "3.8"

services:
  freac:
    image: jlesage/freac
    container_name: freac
    ports:
      - "5800:5800"
    volumes:
      - ./freac-config:/config
      - /mnt/nas-media/Media/Audio-ripped:/output
    devices:
      - ${OPTICAL_DRIVE_PATH}:/dev/sr0
    restart: unless-stopped

networks:
  default:
    name: proxy_network
    external: true